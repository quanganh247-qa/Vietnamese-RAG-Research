[project]
name = "ragvi"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=4,<5",
    "numpy>=1.26,<3",
    "rank-bm25==0.2.2",
    "transformers>=4.51,<5",
    "underthesea>=9.5,<10",
]

[project.optional-dependencies]
rag = ["sentence-transformers>=4,<6", "torch==2.8.0"]
transformers-backend = ["accelerate>=1,<2", "bitsandbytes>=0.46,<1", "torch==2.8.0"]
eda = ["gdown>=6,<7", "ipykernel>=6,<8", "nbconvert>=7,<8", "scikit-learn>=1.5,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'win32' and platform_machine == 'AMD64'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragvi"]
